name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI artifact
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -o dist/oh-my-disk .
          tar -czf "oh-my-disk-$(go env GOOS)-$(go env GOARCH).tar.gz" -C dist oh-my-disk
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ runner.os }}-${{ runner.arch }}
          path: oh-my-disk-*.tar.gz
          if-no-files-found: error

  desktop:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Build universal macOS app
        run: make app-universal
      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict build/bin/oh-my-disk.app
          lipo build/bin/oh-my-disk.app/Contents/MacOS/oh-my-disk -verify_arch arm64 x86_64
          lipo build/bin/oh-my-disk.app/Contents/MacOS/oh-my-disk-cli -verify_arch arm64 x86_64
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/oh-my-disk.app oh-my-disk-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          path: oh-my-disk-macos-universal.zip
          if-no-files-found: error
